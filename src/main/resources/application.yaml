ktor:
  deployment:
    port: ${APP_PORT}:8080
  application:
    modules:
      - ApplicationKt.module
  environment: ${APP_ENV}

database:
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  driver: "org.postgresql.Driver"
  pool:
    maxSize: ${DB_POOL_MAX_SIZE}:5
    minIdle: ${DB_POOL_MIN_IDLE}:1
    idleTimeout: ${DB_POOL_IDLE_TIMEOUT}:600000
    connectionTimeout: ${DB_POOL_CONN_TIMEOUT}:30000
    maxLifetime: ${DB_POOL_MAX_LIFETIME}:1800000

logging:
  level: ${LOG_LEVEL}:"INFO"
